<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header>
    <h1>Smart Calendar</h1>
    <button id="themeToggle">Dark</button>
  </header>

  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prevMonth">◀</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth">▶</button>
    </div>
    <div id="calendar" class="calendar-grid"></div>
  </div>

  <div class="event-panel">
    <h3 id="selectedDateTitle">Select a date</h3>

    <input type="text" id="eventText" placeholder="Add event..." />

    <div class="category-options">
      <label><input type="radio" name="category" value="work"> Work</label>
      <label><input type="radio" name="category" value="personal"> Personal</label>
      <label><input type="radio" name="category" value="school"> School</label>
    </div>

    <label class="urgent-checkbox">
      <input type="checkbox" id="urgentCheckbox"> Mark as Urgent
    </label>

    <button id="addEventBtn">Add Event</button>

    <div id="eventsList" class="events-list"></div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Datepicker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle"></button>
<div class="container">
  
  <div class="datepicker-wrapper">
    <input type="text" id="dateInput" placeholder="Select a date" readonly>

    <div class="datepicker" id="datepicker">
      <div class="header">
        <button id="prev">&#10094;</button>
        <div id="monthYear"></div>
        <button id="next">&#10095;</button>
      </div>

      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div class="days" id="days"></div>
    </div>
  </div>

  <div class="event-panel">
    <h3 id="eventTitle">Events</h3>
    
    <div id="eventList"></div>

    <div class="event-input">
      <input type="text" id="eventText" placeholder="Add new event...">
      <button id="addEventBtn">Add</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

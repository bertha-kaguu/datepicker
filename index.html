<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header>
      <h1>Smart Calendar</h1>
      <button id="themeToggle">Toggle Theme</button>
    </header>

    <div class="calendar-container">
      <div class="calendar-header">
        <button id="prevMonth">◀</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth">▶</button>
      </div>

      <div class="calendar-grid" id="calendar"></div>
    </div>

    <div class="event-panel">
      <h3 id="selectedDateTitle">Select a date</h3>

      <div class="event-form">
        <input type="text" id="eventText" placeholder="Add event..." />

        <div class="category-options">
          <label><input type="radio" name="category" value="work"> Work</label>
          <label><input type="radio" name="category" value="personal"> Personal</label>
          <label><input type="radio" name="category" value="school"> School</label>
        </div>

        <button id="addEventBtn">Add Event</button>
      </div>

      <div class="events-list" id="eventsList"></div>

      <div class="event-actions">
        <button id="editBtn">Edit</button>
        <button id="urgentBtn">Urgent</button>
        <button id="deleteBtn">Delete</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
